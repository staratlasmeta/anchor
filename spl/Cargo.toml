[package]
name = "anchor-spl"
version.workspace = true
authors = ["Serum Foundation <foundation@projectserum.com>"]
edition = "2021"
license = "Apache-2.0"
description = "CPI clients for SPL programs"
publish = ["star-atlas"]

[features]
default = ["mint", "token", "associated_token"]
mint = []
token = ["spl-token"]
associated_token = ["spl-associated-token-account"]
governance = []
shmem = []
devnet = []
metadata = ["mpl-token-metadata"]
dex = ["serum_dex"]

[dependencies]
anchor-lang = { path = "../lang", version = "0.25.25", registry = "star-atlas", features = ["derive"] }
mpl-token-metadata = { version = "1.2.7", optional = true, features = ["no-entrypoint"] }
serum_dex = { version = "0.4.0", features = ["no-entrypoint"], optional = true }
solana-program.workspace = true
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"], optional = true }
spl-token = { version = "7.0.0", features = ["no-entrypoint"], optional = true }
