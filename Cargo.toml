[profile.release]
lto = true

[profile.release.package.anchor-cli]
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "cli",
    "client",
    "lang",
    "lang/attribute/*",
    "lang/derive/*",
    "lang/syn",
    "spl",
]

[workspace.package]
version = "0.25.25"

[workspace.dependencies]
anchor-client = { path = "./client", version = "0.25.25", registry = "star-atlas" }
anchor-lang = { path = "./lang", version = "0.25.25", registry = "star-atlas" }
anchor-syn = { path = "./lang/syn", version = "0.25.25", registry = "star-atlas" }

solana-cli-config = "=2.1.16"
solana-client = "=2.1.16"
solana-faucet = "=2.1.16"
solana-program = "=2.1.16"
solana-sdk = "=2.1.16"
solana-account-decoder = "=2.1.16"

anyhow = "1.0.32"
borsh = "1.5.7"
bs58 = "0.3.1"
cargo_toml = "0.18.0"
chrono = "0.4.19"
clap = { version = "3.0.13", features = ["derive"] }
dirs = "3.0"
flate2 = "1.0.19"
heck = "0.3.1"
mpl-token-metadata = { version = "1.2.7", features = ["no-entrypoint"] }
pathdiff = "0.2.0"
portpicker = "0.1.1"
proc-macro2 = { version = "1.0", features=["span-locations"] }
proc-macro2-diagnostics = "0.9"
quote = "1.0"
rand = "0.7.3"
regex = "1.4.5"
reqwest = { version = "0.11.4", features = ["multipart", "blocking"] }
rustversion = "1.0.3"
semver = "1.0.4"
serde = { version = "1.0.122", features = ["derive"] }
serde_json = "1.0"
serum_dex = { version = "0.4.0", features = ["no-entrypoint"] }
sha2 = "0.9.2"
shellexpand = "2.1.0"
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
syn = { version = "1.0.60", features = ["full", "extra-traits", "parsing"] }
tar = "0.4.35"
thiserror = "1.0.20"
tokio = "1.0"
toml = "0.5.8"
url = "2.2.2"
walkdir = "2.3.2"

# version locks
base64ct = "<1.7.0"
bytemuck_derive = "<1.8.1"
fixed = "<1.29.0"
half = "<2.5.0"
litemap = ">0.7.0,<0.7.5"
native-tls = "<0.2.14"
zerofrom = "<0.1.6"
