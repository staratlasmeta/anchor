[profile.release]
lto = true

[profile.release.package.anchor-cli]
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "cli",
    "client",
    "lang",
    "lang/attribute/*",
    "lang/derive/*",
    "lang/syn",
    "spl",
]

[workspace.package]
version = "1.25.29"

[workspace.dependencies]
anchor-attribute-access-control = { path = "./lang/attribute/access-control", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-account = { path = "./lang/attribute/account", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-constant = { path = "./lang/attribute/constant", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-error = { path = "./lang/attribute/error", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-event = { path = "./lang/attribute/event", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-interface = { path = "./lang/attribute/interface", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-program = { path = "./lang/attribute/program", version = "1.25.29", registry = "star-atlas" }
anchor-attribute-state = { path = "./lang/attribute/state", version = "1.25.29", registry = "star-atlas" }
anchor-client = { path = "./client", version = "1.25.29", registry = "star-atlas" }
anchor-derive-accounts = { path = "./lang/derive/accounts", version = "1.25.29", registry = "star-atlas" }
anchor-lang = { path = "./lang", version = "1.25.29", registry = "star-atlas" }
anchor-syn = { path = "./lang/syn", version = "1.25.29", registry = "star-atlas" }

solana-account-decoder = ">=2.0,<2.2"
solana-cli-config = ">=2.0,<2.2"
solana-client = ">=2.0,<2.2"
solana-faucet = ">=2.0,<2.2"
solana-program = ">=2.0,<2.2"
solana-sdk = ">=2.0,<2.2"

anyhow = "1.0.32"
arrayref = "0.3.6"
base64 = "0.13.0"
bincode = "1.3.3"
borsh = "1.5.7"
bs58 = "0.3.1"
bytemuck = "1.4.0"
cargo_toml = "0.18.0"
chrono = "0.4.19"
clap = { version = "3.0.13", features = ["derive"] }
dirs = "3.0"
flate2 = "1.0.19"
heck = "0.3.1"
mpl-token-metadata = { version = "1.2.7", features = ["no-entrypoint"] }
pathdiff = "0.2.0"
portpicker = "0.1.1"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
proc-macro2-diagnostics = "0.9"
quote = "1.0"
rand = "0.7.3"
regex = "1.4.5"
reqwest = { version = "0.11.4", features = ["multipart", "blocking"] }
semver = "1.0.4"
serde = { version = "1.0.122", features = ["derive"] }
serde_json = "1.0"
serum_dex = { version = "0.4.0", features = ["no-entrypoint"] }
sha2 = "0.9.2"
shellexpand = "2.1.0"
spl-associated-token-account = { version = "6.0.0", features = ["no-entrypoint"] }
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
syn = { version = "1.0.60", features = ["full", "extra-traits", "parsing"] }
tar = "0.4.35"
thiserror = "1.0.20"
tokio = "1.0"
toml = "0.5.8"
url = "2.2.2"
walkdir = "2.3.2"

# version locks
base64ct = "<1.7.0"
bytemuck_derive = "<1.8.1"
fixed = "<1.29.0"
half = "<2.5.0"
litemap = ">0.7.0,<0.7.5"
native-tls = "<0.2.14"
zerofrom = "<0.1.6"
